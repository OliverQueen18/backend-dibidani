# Overlay Dibidani pour le compose VPS (nginx-proxy + Let's Encrypt).
# Copier ce fichier à côté du docker-compose.yml du serveur, puis :
#   docker compose -f docker-compose.yml -f docker-compose.dibidani.yml up -d
#
# DNS : A/AAAA dibidani.com et www.dibidani.com → IP du VPS
# Uploads : le Nginx du frontend reverse-proxie /api et /uploads vers backend:8080
# (alias réseau). L’API n’est pas exposée sur internet.

services:
  postgres-dibidani:
    image: postgres:16-alpine
    container_name: postgres-dibidani
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DIBIDANI_DB}
      POSTGRES_USER: ${DIBIDANI_DB_USER}
      POSTGRES_PASSWORD: ${DIBIDANI_DB_PASS}
    volumes:
      - dibidani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DIBIDANI_DB_USER} -d ${DIBIDANI_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - dibidani

  image-studio-dibidani:
    image: oliverqueen18/dibidani-image-studio:${DIBIDANI_TAG:-latest}
    container_name: dibidani-image-studio
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      ENGINE: ${DIBIDANI_PHOTO_STUDIO_ENGINE:-local}
      API_ENGINE_URL: ${DIBIDANI_PHOTO_STUDIO_API_URL:-}
      SERVICE_TOKEN: ${DIBIDANI_PHOTO_STUDIO_TOKEN}
      UPLOADS_ROOT: /app/uploads
      WATERMARK_PATH: /app/assets/favicon-dibidani.png
      MAX_CONCURRENCY: "1"
    volumes:
      - ${DIBIDANI_UPLOAD_HOST_PATH:-./uploads/dibidani}:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      dibidani:
        aliases:
          - image-studio

  backend-dibidani:
    image: oliverqueen18/dibidani-backend:${DIBIDANI_BACKEND_TAG:-${DIBIDANI_TAG:-latest}}
    container_name: dibidani-backend
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      postgres-dibidani:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres-dibidani:5432/${DIBIDANI_DB}
      DB_USER: ${DIBIDANI_DB_USER}
      DB_PASSWORD: ${DIBIDANI_DB_PASS}
      JWT_SECRET: ${DIBIDANI_JWT_SECRET}
      ADMIN_EMAIL: ${DIBIDANI_ADMIN_EMAIL:?DIBIDANI_ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${DIBIDANI_ADMIN_PASSWORD:?DIBIDANI_ADMIN_PASSWORD is required}
      ADMIN_NAME: ${DIBIDANI_ADMIN_NAME:-Administrateur Dibidani}
      ADMIN_PHONE: ${DIBIDANI_ADMIN_PHONE:-}
      CORS_ORIGINS: ${DIBIDANI_CORS_ORIGINS:-https://dibidani.com,https://www.dibidani.com}
      PUBLIC_URL: ${DIBIDANI_PUBLIC_URL:-https://dibidani.com}
      UPLOADS_DIR: /app/uploads
      PHOTO_STUDIO_URL: http://image-studio:8090
      PHOTO_STUDIO_ENGINE: ${DIBIDANI_PHOTO_STUDIO_ENGINE:-local}
      PHOTO_STUDIO_TOKEN: ${DIBIDANI_PHOTO_STUDIO_TOKEN}
      SEED_DEMO_DATA: "false"
      PAYMENT_MOCK_ENABLED: "false"
      PAYMENT_MOCK_WEBHOOK_SECRET: ${DIBIDANI_PAYMENT_WEBHOOK_SECRET:-}
      AUTH_OAUTH_MOCK_ENABLED: "false"
      SOCIAL_MOCK_ENABLED: ${DIBIDANI_SOCIAL_MOCK_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${DIBIDANI_GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${DIBIDANI_GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${DIBIDANI_FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${DIBIDANI_FACEBOOK_APP_SECRET:-}
      FACEBOOK_PAGE_ID: ${DIBIDANI_FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${DIBIDANI_FACEBOOK_PAGE_ACCESS_TOKEN:-}
      TIKTOK_ACCESS_TOKEN: ${DIBIDANI_TIKTOK_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${DIBIDANI_WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${DIBIDANI_WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PUBLISH_TO: ${DIBIDANI_WHATSAPP_PUBLISH_TO:-}
      TWILIO_ACCOUNT_SID: ${DIBIDANI_TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${DIBIDANI_TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${DIBIDANI_TWILIO_WHATSAPP_FROM:-}
      MAIL_HOST: ${DIBIDANI_MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${DIBIDANI_MAIL_PORT:-587}
      MAIL_USERNAME: ${SMTP_USER}
      MAIL_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${SMTP_USER}
      MAIL_FROM_NAME: ${DIBIDANI_MAIL_FROM_NAME:-Dibidani}
      MAIL_MOCK_ENABLED: "false"
      SMS_GATEWAY_BASE_URL: ${DIBIDANI_SMS_GATEWAY_BASE_URL:-}
      SMS_GATEWAY_USERNAME: ${DIBIDANI_SMS_GATEWAY_USERNAME:-}
      SMS_GATEWAY_PASSWORD: ${DIBIDANI_SMS_GATEWAY_PASSWORD:-}
      SMS_GATEWAY_TOKEN: ${DIBIDANI_SMS_GATEWAY_TOKEN:-}
      SMS_GATEWAY_DEVICE_ID: ${DIBIDANI_SMS_GATEWAY_DEVICE_ID:-}
      SMS_GATEWAY_SIM_NUMBER: ${DIBIDANI_SMS_GATEWAY_SIM_NUMBER:-}
      SMS_GATEWAY_MOCK_ENABLED: ${DIBIDANI_SMS_MOCK_ENABLED:-true}
      ORANGE_MONEY_BASE_URL: ${DIBIDANI_ORANGE_MONEY_BASE_URL:-https://api.orange.com}
      ORANGE_MONEY_WEBPAY_PATH: ${DIBIDANI_ORANGE_MONEY_WEBPAY_PATH:-}
      ORANGE_MONEY_CLIENT_ID: ${DIBIDANI_ORANGE_MONEY_CLIENT_ID:-}
      ORANGE_MONEY_CLIENT_SECRET: ${DIBIDANI_ORANGE_MONEY_CLIENT_SECRET:-}
      ORANGE_MONEY_MERCHANT_KEY: ${DIBIDANI_ORANGE_MONEY_MERCHANT_KEY:-}
      MOOV_MONEY_BASE_URL: ${DIBIDANI_MOOV_MONEY_BASE_URL:-}
      MOOV_MONEY_INITIATE_PATH: ${DIBIDANI_MOOV_MONEY_INITIATE_PATH:-}
      MOOV_MONEY_MERCHANT_ID: ${DIBIDANI_MOOV_MONEY_MERCHANT_ID:-}
      MOOV_MONEY_API_KEY: ${DIBIDANI_MOOV_MONEY_API_KEY:-}
      MOOV_MONEY_WEBHOOK_SECRET: ${DIBIDANI_MOOV_MONEY_WEBHOOK_SECRET:-}
      SHOP_PHONE: ${DIBIDANI_SHOP_PHONE:-}
      SHOP_WHATSAPP: ${DIBIDANI_SHOP_WHATSAPP:-}
      SHOP_EMAIL: ${DIBIDANI_SHOP_EMAIL:-contact@dibidani.com}
      SHOP_ADDRESS: ${DIBIDANI_SHOP_ADDRESS:-}
      SHOP_OPENING_HOURS: ${DIBIDANI_SHOP_OPENING_HOURS:-}
      SHOP_FACEBOOK_URL: ${DIBIDANI_SHOP_FACEBOOK_URL:-https://www.facebook.com/dibidani}
      SHOP_TIKTOK_URL: ${DIBIDANI_SHOP_TIKTOK_URL:-https://www.tiktok.com/@dibidani}
    volumes:
      - ${DIBIDANI_UPLOAD_HOST_PATH:-./uploads/dibidani}:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 50s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      dibidani:
        aliases:
          - backend

  frontend-dibidani:
    image: oliverqueen18/dibidani-frontend:${DIBIDANI_FRONTEND_TAG:-${DIBIDANI_TAG:-latest}}
    container_name: dibidani-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend-dibidani:
        condition: service_healthy
    environment:
      VIRTUAL_HOST: ${DIBIDANI_HOST:-dibidani.com},${DIBIDANI_HOST_WWW:-www.dibidani.com}
      LETSENCRYPT_HOST: ${DIBIDANI_HOST:-dibidani.com},${DIBIDANI_HOST_WWW:-www.dibidani.com}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      VIRTUAL_PORT: 80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - proxy
      - dibidani

volumes:
  dibidani_pgdata:

networks:
  proxy:
  dibidani:
