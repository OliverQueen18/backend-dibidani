# API + PostgreSQL pour le développement backend seul.
# PostgreSQL n'écoute que sur 127.0.0.1. Pour la stack complète (Nginx + Angular),
# lancer le compose du dossier parent `dibidani/`.
name: dibidani-api

services:
  db:
    image: postgres:16-alpine
    container_name: dibidani-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dibidani}
      POSTGRES_USER: ${POSTGRES_USER:-dibidani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - dibidani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dibidani} -d ${POSTGRES_DB:-dibidani}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - data

  backend:
    image: ${BACKEND_IMAGE:-dibidani-backend:local}
    build: .
    container_name: dibidani-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dibidani}
      DB_USER: ${POSTGRES_USER:-dibidani}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur Dibidani}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:80}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4200}
      UPLOADS_DIR: /app/uploads
      PHOTO_STUDIO_URL: http://image-studio:8090
      PHOTO_STUDIO_ENGINE: ${PHOTO_STUDIO_ENGINE:-local}
      PHOTO_STUDIO_TOKEN: ${PHOTO_STUDIO_TOKEN:-dibidani-dev-studio}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-true}
      PAYMENT_MOCK_WEBHOOK_SECRET: ${PAYMENT_MOCK_WEBHOOK_SECRET:-}
      SHOP_WHATSAPP: ${SHOP_WHATSAPP:-+223 76 12 34 56}
      SHOP_FACEBOOK_URL: ${SHOP_FACEBOOK_URL:-https://www.facebook.com/dibidani}
      SHOP_TIKTOK_URL: ${SHOP_TIKTOK_URL:-https://www.tiktok.com/@dibidani}
      SOCIAL_MOCK_ENABLED: ${SOCIAL_MOCK_ENABLED:-true}
      AUTH_OAUTH_MOCK_ENABLED: ${AUTH_OAUTH_MOCK_ENABLED:-true}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PUBLISH_TO: ${WHATSAPP_PUBLISH_TO:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Dibidani}
      MAIL_MOCK_ENABLED: ${MAIL_MOCK_ENABLED:-true}
      SMS_GATEWAY_BASE_URL: ${SMS_GATEWAY_BASE_URL:-https://api.sms-gate.app/3rdparty/v1}
      SMS_GATEWAY_USERNAME: ${SMS_GATEWAY_USERNAME:-}
      SMS_GATEWAY_PASSWORD: ${SMS_GATEWAY_PASSWORD:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      SMS_GATEWAY_DEVICE_ID: ${SMS_GATEWAY_DEVICE_ID:-}
      SMS_GATEWAY_SIM_NUMBER: ${SMS_GATEWAY_SIM_NUMBER:-}
      SMS_GATEWAY_MOCK_ENABLED: ${SMS_GATEWAY_MOCK_ENABLED:-true}
    volumes:
      - dibidani_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 50s
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - edge
      - data

  image-studio:
    image: ${STUDIO_IMAGE:-dibidani-image-studio:local}
    build:
      context: ./image-studio
    container_name: dibidani-image-studio
    environment:
      ENGINE: ${PHOTO_STUDIO_ENGINE:-local}
      SERVICE_TOKEN: ${PHOTO_STUDIO_TOKEN:-dibidani-dev-studio}
      UPLOADS_ROOT: /app/uploads
      WATERMARK_PATH: /app/assets/favicon-dibidani.png
    volumes:
      - dibidani_uploads:/app/uploads
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - data

volumes:
  dibidani_pgdata:
  dibidani_uploads:

networks:
  edge:
    name: dibidani-api-edge
    driver: bridge
  data:
    name: dibidani-api-data
    driver: bridge
    internal: true
